[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-memory-mcp"
version = "0.2.0"
description = "Project-scoped auditable Markdown memory, CLI and official MCP transport"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Pein2017/shared-memory-mcp"

[project.optional-dependencies]
mcp = ["mcp>=1.27,<2"]
test = ["pytest>=8"]

[project.scripts]
shared-memory = "shared_memory_mcp.cli:main"
shared-memory-mcp = "shared_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shared_memory_mcp = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
