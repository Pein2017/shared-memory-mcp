schema: spec-driven

context: |
  Language: en
  All artifacts use English structural headings and SHALL/MUST requirements.
  This Python >=3.11 package owns an Agent-oriented, harness-neutral shared
  Markdown memory core, stdio MCP, CLI and thin native adapters. Runtime data
  is configured separately, initially /data/CoordExp/.shared-memory/.
  Markdown is canonical; SQLite coordinates cooperating writers and idempotency
  on one Linux host/local filesystem. Native harness memories remain independent.
  Actual caller cwd/harness/session determines scope; unknown or ambiguous
  bindings fail closed. Retain provenance, review, exact-scope correction,
  logical withdrawal, current access checks and interrupted-write recovery.
  Memory publication is neither scientific proof nor execution authority.
  No daemon, automatic transcript extraction, scheduler, background model calls,
  mandatory embeddings or new memory Git repository is required.
  openspec/specs is the current reconciled implemented behavior contract after
  the 2026-10-09 task-aware successor archive. No OpenSpec change is active.
  Historical deltas and model-specific qualification receipts are evidence,
  not new execution grants; first historical batch 8.2 was withdrawn.
  The target provides one MCP entrypoint for ordinary Agent maintenance and
  manually requested Dreaming, bounded content-bearing context, foreground
  research/general mode selection and source-linked as-of project understanding.
  Normal source updates preserve useful prior understanding; current judgments
  require relevant current-owner checks by the foreground Agent. Access
  revocation and explicit withdrawal still deny affected content.
  Keep one bundled shared-memory skill through the existing shared skill entry.
  Archival is documentation/contract maintenance only, not a memory operation.
  Any subsequent live installation, production-memory write, history batch,
  service change or paid model call requires independent task authority.
